apiVersion: v1
kind: Namespace
metadata:
  name: model
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: l2-model
  namespace: model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: l2-model
  template:
    metadata:
      labels:
        app: l2-model
    spec:
      containers:
        - name: l2-model
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: l2-model
  namespace: model
spec:
  selector:
    app: l2-model
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
